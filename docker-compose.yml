services:
  pyspark:
    build: .
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
      # Spark UI: 4040 for the first SparkSession, 4041+ for each additional
      # concurrent session (e.g. a second notebook with an active session).
      - "4040-4045:4040-4045"
    volumes:
      - ./notebooks:/home/jovyan/notebooks
      - ./data:/home/jovyan/data
    environment:
      - JUPYTER_TOKEN=${JUPYTER_TOKEN:-pyspark}
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
    restart: unless-stopped
